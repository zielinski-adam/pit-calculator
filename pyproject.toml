[project]
name = "pit-calculator"
version = "0.1.0"
description = "Kalkulator PIT-38 dla polskich rezydentów podatkowych inwestujących przez Interactive Brokers"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.0",
    "exchange-calendars>=4.5",
    "httpx>=0.27",
    "lxml>=5.0",
    "uvicorn>=0.30",
    "loguru>=0.7",
    "click>=8.1",
    "rich>=13.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
pit38 = "pit38.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "B", "A", "COM", "C4", "DTZ", "ISC", "ICN", "PIE", "PT", "RSE", "RET", "SIM", "TID", "TCH", "ARG", "PTH", "ERA", "PL", "TRY", "FLY", "PERF", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "fifo: FIFO engine tests",
    "settlement: Settlement date calculation tests",
    "boundary: Year boundary edge case tests",
    "nbp: NBP rate fetching tests",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/src/pit38"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
